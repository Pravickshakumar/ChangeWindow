# Generate ChangeWindow.xcodeproj with:  brew install xcodegen && xcodegen generate
name: ChangeWindow
options:
  bundleIdPrefix: com.vignesh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # ← set your Apple Developer team ID (or pick it in Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  ChangeWindow:
    type: application
    platform: iOS
    sources:
      - path: ChangeWindow
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vignesh.changewindow
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ChangeWindowWidget
      - target: ChangeWindowShare
      - target: ChangeWindowNotificationContent

  ChangeWindowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ChangeWindowWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vignesh.changewindow.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  ChangeWindowShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ChangeWindowShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vignesh.changewindow.share
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  ChangeWindowNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: ChangeWindowNotificationContent
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vignesh.changewindow.notificationcontent
        INFOPLIST_FILE: Config/NotificationContent-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/NotificationContent.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  ChangeWindowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChangeWindowTests
    dependencies:
      - target: ChangeWindow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vignesh.changewindow.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChangeWindow.app/ChangeWindow"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ChangeWindow:
    build:
      targets:
        ChangeWindow: all
        ChangeWindowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChangeWindowTests
